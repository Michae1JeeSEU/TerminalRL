  change_cp_objective: false
  tail_model_training: false
  tail_model_inference: false
  online_rl: false
  world_model: false
  cp_branching_learning: false
  learned_safety_authorization: false
  physical_rules_changed: false
  emergency_rules_changed: false
  final_authoritative_validation_required: true
proposal:
  unit: unmaterialized_WorkDescriptor
  learned_output: priority_order_only
  stages:
  - progress
  - reference
  - alternative
  descriptor_schema_id: work_descriptor_v1_0
  allowed_target_kinds:
  - next_ring_slot
  - normal_pad
  ready_batch_max: 64
  materializations_per_rank_max: 8
  parent_must_be_materialized: true
  allow_new_continuous_action_space: false
  full_generated_catalog_before_inference: false
  coverage:
    preserve_keep_wait: true
    preserve_commitments_and_dependencies: true
    inherit_stage2_catalog_diversity: true
    initial_pass: one_heuristic_opportunity_per_eligible_aircraft_if_budget_available
    ring_order:
    - outer
    - middle
    - inner
    within_ring_order: energy_slack_then_stable_id
    post_initial_interleave:
    - learned
    - learned
    - learned
    - heuristic
    unserved_aircraft_count_logged: true
  budget:
    reference_scale: 1.0
    reduced_scale: 0.5
    scaled_fields:
    - candidate_seconds
    - max_per_aircraft
    - max_attempts
    integer_scaling: max(1,floor(reference*0.5))
    unchanged_fields:
    - solver_seconds
    - hint_seconds
    - soft_seconds
    - watchdog_seconds
    - max_refinement_rounds
    - catalog_cap
    deterministic_finish_fraction: 0.2
    full_budget_reset_on_fallback: false
    same_coverage_for_reduced_control: true
    historical_example_only:
      candidate_seconds:
      - 12.0
      - 6.0
      max_per_aircraft:
      - 64
      - 32
      max_attempts:
      - 2048
      - 1024
