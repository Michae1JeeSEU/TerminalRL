    speed_mps: 25.0
    acceleration_mps2: 1.5
    time: BOUND_STAGE2_HORIZON
    power_W: 100000.0
    energy_J: BOUND_MODEL_EQUIVALENT_CAPACITY
    SOC: 1.0
  learned_standardization_fit_split: train
  downstream_estimator: SHARED_BOUND_STAGE2_OR_MISSING_MASK
  full_scene_aggregate_only: false
model:
  family: candidate_conditioned_set_mlp
  architecture_id: cc_set_mlp64_v1_0
  entity_encoder_hidden:
  - 64
  - 64
  query_encoder_hidden:
  - 64
  - 64
  pooling:
  - masked_mean
  - masked_max
  - normalized_count
  score_head_hidden:
  - 128
  - 64
  activation: ReLU
  dropout: 0.0
  batch_norm: false
  heads:
  - priority_score
  - single_vehicle_valid_logit
  - log1p_compute_cost_ms
  priority_uses_auxiliary_ratio: false
  parameter_count_cap: 250000
  dtype: float32
  device: cpu
  physics_dtype_changed: false
training:
  paradigm: offline_supervised_grouped_pairwise_ranking
  formal_runs_max: 1
  seed: 20261023
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 30
  batch_context_groups_max: 16
  pairs_per_group_per_batch_max: 64
  gradient_clip_norm: 1.0
  early_stopping_patience: 5
  selection_metric: validation_rank_loss
  loss:
    ranking: pairwise_softplus
    single_vehicle_validity: masked_binary_cross_entropy
    compute_cost: masked_huber_log1p_ms
    huber_delta: 1.0
    weights:
      ranking: 1.0
      single_vehicle_validity: 0.1
      compute_cost: 0.1
    reduction: per_context_then_batch_mean
  validity_label_mask_required: true
  cost_timeout_is_censored: true
  unknown_is_negative: false
  unselected_is_negative: false
  zero_effective_pairs_action: DATA_INSUFFICIENT_NO_FORMAL_TRAINING
  no_validation_rank_labels_action: DATA_INSUFFICIENT_NO_TEST_BASED_SELECTION
  debug_overfit:
    enabled: true
    max_gradient_steps: 100
    discard_debug_weights_before_formal_training: true
  grid_search: false
  automatic_retraining: false
  test_based_tuning: false
  auxiliary_heads_policy: ENABLED_WITH_VALID_LABEL_MASKS_ONLY
labeling:
