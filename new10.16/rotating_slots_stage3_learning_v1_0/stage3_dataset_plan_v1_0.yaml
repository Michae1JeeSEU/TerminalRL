input_sources:
  priority:
  - COMPATIBLE_UNSEEN_INDEPENDENT_EXISTING_ROOT
  - EXISTING_VALID_FIXTURE_FACTORY_NEW_SEED
  factory_preserve:
  - physical_config
  - service_distribution
  - SOC_distribution
  - slot_safety
  - emergency_rules
  - admission_rules
  never_fabricate:
  - in_flight_commitments
  - past_energy_ledger
  - historical_failures
  - passed_audits
seed_collision_policy:
  meaning: preferred seed already used for development or another ancestry
  action: deterministically_allocate_smallest_unused_integer_ge_7301_and_freeze_before_labels
  look_at_outcomes_to_pick_seed: false
grouping_keys:
- ancestry_root_id
- manifest_lineage_id
- checkpoint_parent_id
grouping_policy: CONNECTED_COMPONENTS_CANNOT_CROSS_SPLITS
development:
  seed_71_role: DEVELOPMENT_ONLY
  snapshots_max: 18
  rerun_long_history_to_fill: false
  formal_training_use: false
  formal_validation_use: false
  formal_test_use: false
  debug_weights_reusable: false
heldout_access: AFTER_MODEL_AND_NORMALIZER_FREEZE_ONLY
mixed_policy_prefix: PRESERVE_SEGMENT_PROVENANCE_NOT_RELABEL_AS_PURE_NEW_POLICY
legacy_failed_frame_audits: NO_RECLASSIFICATION_FILTER_EVENT_DEPENDENT_LABELS
short_pilot:
  preferred_root_id: s3r23
  preferred_seed: 7323
  profile: medium24_rate150_v1
  selection_rule: first_medium_in_frozen_test_order
  missing_case_action: EVALUATION_INPUT_MISSING_NO_TRAIN_ROOT_SUBSTITUTION
  sim_seconds: 60
  manifest_shared_by_all_arms: true
  unrevealed_manifest_in_features: false
budget_limited_policy: SAVE_ACTUAL_COUNTS_NO_RESAMPLING_TO_FORCE_TARGET
statistical_claim: PILOT_ONLY_NOT_LONG_HORIZON_GENERALIZATION_EVIDENCE
heldout_precollection: AUTOMATED_SEALED_LABELS_ALLOWED_NO_TRAIN_OR_TUNING_ACCESS
