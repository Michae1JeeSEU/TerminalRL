name: dynamic_rule
experiment_mode: dynamic_rule
simulation_only: true
dt: 1.0
control_interval: 1.0
high_level_interval: 20.0
high_level:
  metrics_sampling_interval_seconds: 20.0
  decision_interval_seconds: 20.0
  reconfiguration_dwell_seconds: 20.0
  geometry_transition_seconds: 20.0

rings:
  outer:
    index: 2
    radius: 400.0
    height: 400.0
    speed: 28.0
    capacity: 6
  inner:
    index: 1
    radius: 200.0
    height: 200.0
    speed: 20.0
