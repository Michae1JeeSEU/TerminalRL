vehicle_limits:
  speed_min: 8.0
  speed_max: 36.0
  max_acceleration: 4.0

safety:
  safe_distance: 80.0
  nmac_distance: 40.0
  collision_distance: 20.0

timing:
  ring_to_ring_min_time_gap_s: 7.0
  final_min_time_gap_s: 12.0

arrival_flow:
  initial_aircraft_count: 6
  arrival_rate: 0.0

reward_weights:
  step_penalty: -0.035
  progress_weight: 0.05
