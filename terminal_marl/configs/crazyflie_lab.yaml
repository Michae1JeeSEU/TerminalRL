name: crazyflie_lab
experiment_mode: crazyflie_lab
simulation_only: true
center: [0.0, 0.0, 0.0]
dt: 0.2
control_interval: 0.2
high_level_interval: 5.0
high_level:
  metrics_sampling_interval_seconds: 5.0
  decision_interval_seconds: 5.0
  reconfiguration_dwell_seconds: 5.0
  geometry_transition_seconds: 1.0
max_steps: 600

rings:
  outer:
    index: 2
    radius: 1.2
    height: 1.2
    speed: 0.35
    capacity: 3
  inner:
    index: 1
    radius: 0.7
    height: 0.8
    speed: 0.25
    capacity: 2

geometry:
  approach_threshold_radius: 1.6
  gate_height: 1.4
  vertiport_radius: 0.15
  vertiport_physical_radius: 0.1
  final_entry_hold_radius: 0.35
  final_entry_capture_radius: 0.15
  ring_capture_radius_tolerance: 0.12
  ring_capture_height_tolerance: 0.1
  touchdown_accept_radius: 0.12

vehicle_limits:
  nominal_speed: 0.35
  speed_min: 0.15
  speed_max: 0.6
  final_speed_min: 0.15
  final_entry_speed: 0.3
  final_approach_speed: 0.2
  touchdown_max_speed: 0.2
  max_acceleration: 0.8
  max_climb_rate: 0.3
  max_descent_rate: 0.3

safety:
  safe_distance: 0.5
  nmac_distance: 0.35
  collision_distance: 0.2
  boundary: [-1.8, 1.8, -1.8, 1.8, 0.1, 1.6]

timing:
  ring_to_ring_min_time_gap_s: 2.0
  final_min_time_gap_s: 3.0
  final_entry_hold_altitude: 0.3
  touchdown_max_height: 0.15

arrival_flow:
  initial_aircraft_count: 3
  formation_rows: 3
  formation_cols: 1
  row_spacing: 0.3
  col_spacing: 0.3
  spawn_margin: 0.2
  spawn_altitude: 1.4
  arrival_rate: 0.0

reward_weights:
  step_penalty: -0.035
  progress_weight: 0.05
  separation_penalty_weight: -0.02
  residual_action_penalty_weight: 0.004
