protocol: V4_2_P3_CURRENT_MDP_BASELINE_V1
status: PREREGISTERED_CURRENT_MDP_BASELINE
scope: fixed_geometry_dense24_current_mdp_paired_rule_original_k3

freeze:
  freeze_before_first_reset: true
  no_seed_evaluated_before_protocol_freeze: true
  consumed_seed_policy: no_rerun_no_reset_no_tuning
  execution_order:
    - fresh_p1_p2_qualification_and_effectiveness_reevaluation
    - p3_high_soc_qualification_baseline
    - p3_low_soc_stress_baseline
    - separate_p3_train_dev_heldout_preregistration_only_if_high_soc_baselines_pass

bindings:
  candidate_controller: original_k3
  candidate_checkpoint_sha256: 4b8be66c100aaaeb5b5699dcce68a96dbe1237964e4c308e7b23b95c62fb8c8c
  paired_controller: rule
  observation_dimension: 88
  observation_schema: phaseA_low_obs_v2_1_retry_state
  action_schema: low_action_schema_v4_2_hierarchical
  runtime_proposal_shortlist_k: 3
  fixed_geometry: true
  no_teacher: true
  no_labels: true
  no_updates: true

safety:
  preferred_separation_m: 80
  protected_separation_m: 40
  collision_event_rule: distance_m_lt_10
  collision_event_threshold_m: 10
  buffer_takeover_requires_swept_and_recursive_certificate: true

energy:
  capacity_units: 1500
  touchdown_soc_min: 0.25
  phase_power_model: current_engineering_approximation

attributes:
  priority_mode: random_135
  priority_values: [1, 3, 5]
  mission_probabilities: [0.45, 0.25, 0.10, 0.20]
  low_soc_analysis_threshold: 0.65

reward:
  low_level_priority_time_weight: 1.0
  low_level_soc_urgency_time_weight: 2.0
  low_level_soc_urgency_threshold: 0.65
  urgency_reward_config_exact: true

scenario:
  name: dense24
  reset_mode: warm_start_rings
  total_requested_uavs: 24
  warm_start_uavs: 12
  warm_start_ring_allocation: [6, 4, 2]
  continuing_arrivals: 12
  arrival_interval_seconds: 15
  horizon_seconds: 1800
  lz_assignment_mode: nearest_available
  release_arbitration_mode: downstream_priority
  final_queue_capacity: 3

cohorts:
  high_soc_qualification:
    initial_soc_mode: uniform
    initial_soc_min: 0.90
    initial_soc_max: 1.00
    seeds: [835001, 835002, 835003]
    controllers: [rule, original_k3]
    paired_same_seed: true
    deterministic: true
    expected_records: 6
    hard_gates:
      each_controller_requested_complete: true
      requested_uavs_per_record: 24
      completion_fraction: 1.0
      no_diverted_requests: true
      no_unresolved_requests: true
      terminal_within_horizon: true
      safety_counters_zero: true
      exact_action_tape_replay: true
      no_teacher: true
      no_labels: true
      no_updates: true
      runtime_shortlist_contract: true
    report:
      request_to_touchdown_seconds: true
      completed_only_wait_is_not_used_as_sole_metric: true
      paired_rule_deltas: true

  low_soc_stress:
    initial_soc_mode: uniform
    initial_soc_min: 0.55
    initial_soc_max: 0.90
    seeds: [835101, 835102, 835103]
    controllers: [rule, original_k3]
    paired_same_seed: true
    deterministic: true
    expected_records: 6
    hard_gates:
      exact_request_accounting: true
      requested_uavs_per_record: 24
      safety_counters_zero: true
      exact_action_tape_replay: true
      no_teacher: true
      no_labels: true
      no_updates: true
      runtime_shortlist_contract: true
      completion_fraction_is_reported_outcome: true
      low_soc_diversions_are_reported_outcome: true
    report:
      request_denominator: 24
      completed_fraction: true
      diverted_low_soc_count: true
      unresolved_count: true
      completed_only_wait_conditional: true
      request_to_touchdown_seconds: true
      paired_rule_deltas: true

stop_conditions:
  stop_on_safety_error: true
  preserve_failure_evidence: true
  no_rerun_consumed_seed: true
  no_reset_consumed_seed: true
  no_tuning_on_consumed_seed: true

authorization:
  p3_baseline_only: true
  new_p3_training_protocol_design_requires_high_soc_rule_and_k3_pass: true
  new_p3_training_launch_automatic: false
  PPO_ALLOWED: false
  P3_QUALIFIED: false
  P4_ALLOWED: false
