  AUDIT_COMPLETE: true
  audit_pass: true
  learnability_pass: true
  repair_preregistration_allowed: true
  GATE_REPAIR_ALLOWED: false
  PPO_ALLOWED: false
  curriculum_promotion_allowed: false
  checkpoint_promotable: false

architecture:
  id: v4_2_hierarchical_gate_temperature_calibrated_residual_adapter_v3
  base: TemperatureCalibratedGateResidualAdapterStudentPPOV42
  initialized_from: exact_deepcopy_of_calibrated_candidate
  trainable_scope: gate_adapter_only
  frozen_components: [actor_encoder, gate_head, proposal_head, critic_encoder, critic_head, gate_temperature]
  proposal_unchanged: true
  critic_unchanged: true
  temperature: 2.5
  migration: none

training:
  seed: 787101
  epochs: 20
  support_batch_size: 128
  d1_batch_size: 128
  steps_per_epoch: max_ceil_support_or_d1_batches
  reshuffle_each_epoch: true
  cycle_shorter_source: true
  optimizer: Adam
  learning_rate: 0.0001
  gradient_clip_norm: 1.0
  objective: 0.5_support_CE_plus_0.5_D1_CE_plus_2.0_D1_anchor_KL
  anchor_KL: categorical_KL_frozen_candidate_to_repaired_float64_logits
  dev_gradients: false
  d1_selection: false
  early_stopping: false
  threshold_tuning: false
  checkpoint_selection: final_epoch_only
  progress: after_each_completed_epoch

numerical_stability:
  candidate_log_probability_dtype: float64
  repaired_log_probability_dtype: float64
  probability_source: exp_candidate_log_softmax
  categorical_from_float32_probabilities: false
  stable_formula: sum(exp(candidate_logp) * (candidate_logp - repaired_logp), dim=-1).mean()
  anchor_weight: 2.0
  finite_component_checks: true
  finite_gradient_checks: true
  failure_context: epoch_step_finite_flags_component_values

evaluation:
  probability_threshold: 0.5
  datasets: [support_train, support_dev, d1_anchor]
  support_breakdowns: [scenario, interface]
  evaluate_final_epoch_once: true
  proposal_logits_invariance: bitwise_or_zero_max_abs_delta
  critic_state_invariance: bitwise
  temperature_state_invariance: bitwise

thresholds:
  support_dev:
    macro_F1_min: 0.80
    WAIT_recall_min: 0.70
    RELEASE_recall_min: 0.80
    brier_max: 0.15
    binary_nll_max: 0.50
    interface_macro_F1_min: 0.70
  d1_anchor:
    macro_F1_min: 0.90
    WAIT_recall_min: 0.90
    RELEASE_recall_min: 0.90
    brier_max: 0.08
    binary_nll_max: 0.30
  invariants:
    proposal_logits: true
    critic_state: true
    temperature_state: true
    common_state_bitwise_equal: true
    parameter_isolation: true
    finite_losses_and_gradients: true

authorization:
  always_false:
    - PPO_ALLOWED
    - GATE_REPAIR_ALLOWED
    - curriculum_promotion_allowed
    - checkpoint_promotable
  pass_only:
    STUDENT_QUALIFICATION_ALLOWED: true
    checkpoint_role: qualification_candidate
  qualification_only: true
  environment_rollout: false
  teacher_calls: false

prohibited:
  - environment_rollout
  - teacher_calls
  - dev_gradients
  - d1_selection
  - threshold_tuning
  - early_stopping
  - PPO
  - policy_migration
